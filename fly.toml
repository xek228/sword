# Fly.io deployment config.
# First-time deploy:
#   curl -L https://fly.io/install.sh | sh
#   fly auth login
#   fly launch --copy-config --name <unique-app-name> --no-deploy
#   fly deploy
#
# Subsequent deploys: fly deploy

app = "sword-prototype"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
